# The reverse proxy settings (client IP, HTTPS) are written by the entrypoint to conf-enabled/synapsemail-proxy.conf.
ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/synapsemail/public_html
    <Directory /var/www/synapsemail/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    # %a is the client address (after mod_remoteip)
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" synapsemail
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log synapsemail
</VirtualHost>
