#   docker compose up -d
# then open http://localhost:8080/ on this server (or your HTTPS address, see docker/README.md) and follow the installer.
services:
  synapsemail:
    image: ghcr.io/xcodz/synapsemail:latest
    container_name: synapsemail
    restart: unless-stopped
    ports:
      # only this server can reach it; put your HTTPS reverse proxy in front (or use "8080:80" on a private network)
      - "127.0.0.1:8080:80"
    volumes:
      - synapsemail-data:/data
    # only what Apache and the start script need; nothing in the container can gain more rights
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE, KILL]
    security_opt:
      - no-new-privileges:true
    # environment:
    #   addresses of your reverse proxy (default "gateway": a proxy on this server); "none" when nothing is in front
    #   SYNAPSEMAIL_TRUSTED_PROXIES: "172.20.0.5"

volumes:
  synapsemail-data:
