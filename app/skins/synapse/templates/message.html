<roundcube:include file="includes/layout.html" />
<roundcube:object name="mailboxlist" folder_filter="mail" type="js" />
<roundcube:if condition="env:framed && !env:extwin" />
	<roundcube:include file="includes/reader-body.html" />
<roundcube:else />
<div class="app-shell" id="appShell">
	<roundcube:include file="includes/header.html" />
	<aside class="mail-sidebar" aria-label="<roundcube:label name="synapse_core.mailfolders" />">
		<roundcube:button command="compose" type="link" class="compose-btn" data-icon="square-pen" data-label="synapse_core.composemail_caps" data-wrap="span" />
		<nav class="folder-nav" aria-label="<roundcube:label name="mail" />">
			<roundcube:button command="list" type="link" class="folder-link active" data-icon="arrow-left" data-label="synapse_core.backtolist" data-wrap="span" />
		</nav>
	</aside>
	<main class="mail-stage reader-active reader-full" id="mailStage">
		<section class="status-strip" aria-label="<roundcube:label name="synapse_core.systemstatus" />">
			<div><span class="live-tag"><roundcube:label name="synapse_core.live" /></span><strong><roundcube:exp expression="strtoupper(config:product_name)" /> <roundcube:label name="synapse_core.securecloud" /></strong><em>//</em><span><roundcube:label name="synapse_core.messageview_caps" /></span></div>
			<div><span id="localClock">00:00:00</span></div>
		</section>
		<section class="reader-pane" id="readerDrawer" aria-label="<roundcube:label name="synapse_core.messagereader" />">
			<div class="reader-header">
				<roundcube:button command="list" type="link" title="back" data-icon="arrow-left" />
				<span id="readerClass"><roundcube:label name="synapse_core.encryptedverified" /></span>
				<div>
					<roundcube:button command="previousmessage" type="link" title="previousmessage" data-icon="chevron-left" />
					<roundcube:button command="nextmessage" type="link" title="nextmessage" data-icon="chevron-right" />
					<roundcube:if condition="env:archive_folder" />
					<roundcube:button command="plugin.archive" type="link" title="archive.buttontitle" data-icon="archive" />
					<roundcube:endif />
					<roundcube:button command="delete" type="link" title="deletemessage" data-icon="trash-2" />
					<roundcube:button command="print" type="link" title="print" data-icon="printer" />
					<button type="button" id="readerMore" title="<roundcube:label name="more" />" aria-haspopup="menu"><i data-lucide="ellipsis"></i></button>
				</div>
			</div>
			<roundcube:include file="includes/reader-body.html" />
		</section>
	</main>
</div>
<roundcube:include file="includes/compose-drawer.html" />
<section class="theme-popover menu-popover" id="moreMenu" aria-label="<roundcube:label name="synapse_core.messageactions" />" aria-hidden="true">
	<div class="popover-heading"><span><roundcube:label name="synapse_core.messageactions_caps" /></span><small><roundcube:label name="synapse_core.selection_caps" /></small></div>
	<button class="theme-choice format-choice" type="button" id="formatChoice" hidden onclick="return UI.frameFormat()"><i data-lucide="file-text"></i><span><b></b><small><roundcube:label name="synapse_core.format_desc" /></small></span><em></em></button>
	<roundcube:button command="forward-attachment" type="link" class="theme-choice" data-icon="paperclip" data-label="synapse_core.forwardatt_caps" data-detail="synapse_core.forwardatt_desc" data-key="" />
	<roundcube:button command="unread" type="link" class="theme-choice" data-icon="mail" data-label="synapse_core.markunread_caps" data-detail="synapse_core.markunread_desc" data-key="" />
	<roundcube:button command="flag" type="link" class="theme-choice" data-icon="star" data-label="synapse_core.flag_caps" data-detail="synapse_core.flag_desc" data-key="" />
	<roundcube:button command="unflag" type="link" class="theme-choice" data-icon="star-off" data-label="synapse_core.unflag_caps" data-detail="synapse_core.unflag_desc" data-key="" />
	<roundcube:button command="copy" type="link" class="theme-choice" data-icon="copy" data-label="synapse_core.copyto_caps" data-detail="synapse_core.copyto_desc" data-key="" />
	<roundcube:button command="move" type="link" class="theme-choice" data-icon="folder-input" data-label="synapse_core.moveto_caps" data-detail="synapse_core.moveto_desc" data-key="" />
	<roundcube:button command="download" type="link" class="theme-choice" data-icon="download" data-label="synapse_core.downloademl_caps" data-detail="synapse_core.downloademl_desc" data-key="" />
	<roundcube:button command="viewsource" type="link" class="theme-choice" data-icon="code" data-label="synapse_core.showsource_caps" data-detail="synapse_core.showsource_desc" data-key="" />
	<roundcube:button command="edit" prop="new" type="link" class="theme-choice" data-icon="file-pen-line" data-label="synapse_core.editasnew_caps" data-detail="synapse_core.editasnew_desc" data-key="" />
</section>
<roundcube:endif />
<roundcube:include file="includes/footer.html" />
