<roundcube:include file="includes/layout.html" />
<div class="app-shell" id="appShell">
	<roundcube:include file="includes/header.html" />
	<roundcube:include file="includes/settings-nav.html" />
	<main class="mail-stage reader-active reader-full settings-stage" id="mailStage">
		<section class="status-strip" aria-label="<roundcube:label name="synapse_core.systemstatus" />">
			<div><span class="live-tag"><roundcube:label name="synapse_core.live" /></span><strong><roundcube:label name="settings" /></strong><em>//</em><span><roundcube:label name="preferences" /></span></div>
			<div><span id="localClock">00:00:00</span></div>
		</section>
		<section class="reader-pane" aria-label="<roundcube:label name="preferences" />">
			<div class="reader-header">
				<span id="settingsTitle"><roundcube:label name="preferences" /></span>
				<div><button type="button" title="<roundcube:label name="save" />" onclick="return UI.frameCommand('save')"><i data-lucide="save"></i></button></div>
			</div>
			<roundcube:object name="contentframe" id="preferences-frame" name="preferences-frame" class="reader-frame" src="env:blankpage" title="arialabelpreferencesform" />
		</section>
	</main>
	<roundcube:include file="includes/utility-rail.html" />
</div>
<roundcube:include file="includes/footer.html" />
