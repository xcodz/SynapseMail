<div class="reader-body" id="readerBody">
	<div class="reader-kicker" id="readerChannel"><roundcube:exp expression="strtoupper(env:synapse_box_name ?: rcmail_action::localize_foldername(env:mailbox ?: 'INBOX', false, true))" /> // EMAIL-<roundcube:exp expression="str_pad(env:uid, 4, '0', STR_PAD_LEFT)" /></div>
	<h1 id="readerSubject"><roundcube:object name="messageHeaders" valueOf="subject" /></h1>
	<div class="reader-meta">
		<div class="reader-avatar" id="readerAvatar">SM</div>
		<div><strong id="readerSender"></strong><small id="readerEmail"></small></div>
		<time id="readerTime"><roundcube:object name="messageHeaders" valueOf="date" /></time>
	</div>
	<span hidden id="readerFrom"><roundcube:object name="messageHeaders" valueOf="from" /></span>
	<div class="reader-copy">
		<div class="data-block reader-headers" id="readerHeaders" hidden>
			<roundcube:object name="messageHeaders" class="headers-table" exclude="subject,from,date" max="10" />
		</div>
		<roundcube:object name="messageObjects" id="message-objects" />
		<roundcube:object name="messageAttachments" id="attachment-list" class="reader-attachments" />
		<roundcube:object name="messageBody" id="messagebody" headertableclass="headers-table" />
	</div>
	<div class="reader-actions">
		<roundcube:button command="reply" type="link" data-icon="reply" data-label="synapse_core.reply_caps" />
		<roundcube:button command="reply-all" type="link" data-icon="reply-all" data-label="synapse_core.replyall_caps" />
		<roundcube:button command="forward" type="link" data-icon="forward" data-label="synapse_core.forward_caps" />
		<button type="button" id="toggleHeaders"><i data-lucide="list"></i> <roundcube:label name="synapse_core.details_caps" /></button>
		<button type="button" id="toggleOriginal" title="<roundcube:label name="synapse_core.colors_title" />"><i data-lucide="palette"></i> <roundcube:label name="synapse_core.originalcolors" /></button>
		<roundcube:if condition="env:optional_format=='text'" />
			<roundcube:button command="change-format" prop="text" type="link" data-icon="file-text" data-label="synapse_core.plaintext_caps" />
		<roundcube:elseif condition="env:optional_format=='html'" />
			<roundcube:button command="change-format" prop="html" type="link" data-icon="file-code" data-label="HTML" />
		<roundcube:endif />
	</div>
</div>

<section class="theme-popover menu-popover" id="attachmentmenu" aria-label="<roundcube:label name="attachment" />" aria-hidden="true">
	<div class="popover-heading"><span><roundcube:label name="synapse_core.attachment_caps" /></span><small><roundcube:label name="synapse_core.file_caps" /></small></div>
	<roundcube:button command="open-attachment" type="link" id="attachmenuopen" class="theme-choice" data-icon="external-link" data-label="synapse_core.open_caps" data-detail="synapse_core.open_desc" data-key="" />
	<roundcube:button command="download-attachment" type="link" id="attachmenudownload" class="theme-choice" data-icon="download" data-label="synapse_core.download_caps" data-detail="synapse_core.download_desc" data-key="" />
	<roundcube:container name="attachmentmenu" id="attachmentmenu" />
</section>

<section class="theme-popover menu-popover" id="mailto-menu" aria-label="<roundcube:label name="address" />" aria-hidden="true">
	<div class="popover-heading"><span><roundcube:label name="synapse_core.address_caps" /></span><small><roundcube:label name="synapse_core.contact_caps" /></small></div>
	<roundcube:button name="addtoaddressbook" type="link" content="" class="theme-choice" data-icon="user-plus" data-label="synapse_core.addtocontacts_caps" data-detail="synapse_core.addtocontacts_desc" data-key="" />
	<roundcube:button name="composeto" type="link" content="" class="theme-choice" data-icon="square-pen" data-label="synapse_core.composeto_caps" data-detail="synapse_core.composeto_desc" data-key="" />
	<roundcube:container name="mailtomenu" id="mailto-menu" />
</section>
