<html><head><meta charset="utf-8"><title></title>
<style>html,body{margin:0;height:100%;background:var(--sm-blank,#0d110e)}</style>
<script>
// an empty detail pane (contacts, identities, responses, folders, settings, mail) takes the background of the theme in
// use from the page around it (--bg-soft); the page calls synapseBlank() again after a theme switch
window.synapseBlank=function(){try{var c=getComputedStyle(parent.document.documentElement).getPropertyValue('--bg-soft').trim();if(c)document.documentElement.style.setProperty('--sm-blank',c)}catch(e){}};
synapseBlank();
</script>
</head><body></body></html>
