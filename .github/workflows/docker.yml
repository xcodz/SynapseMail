# Builds the SynapseMail container image from the signed release zip and publishes it to ghcr.io/xcodz/synapsemail.
# Runs when a release is published (the release must have SynapseMail_v<version>.zip) or by hand for a version.
# Copyright (c) 2026 SynapseCyber.io. Licensed under CC BY-NC-ND 4.0.
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "SynapseMail version, for example 3.5.4 (its GitHub release must have the zip)"
        required: true
      latest:
        description: "Also tag it as latest"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
          LATEST: ${{ github.event_name == 'release' || inputs.latest }}
        run: |
          v="${INPUT:-${TAG#v}}"
          [[ $v =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "not a SynapseMail version: $v"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/synapsemail"
          tags="$image:$v"
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && tags+=",$image:${v%.*}"
          [[ $LATEST == true ]] && tags+=",$image:latest"
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "tags=$tags" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # the zip's signature and every file are checked inside the build (docker/verify-release.php)
      - name: Build for the test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: docker
          build-args: SYNAPSEMAIL_VERSION=${{ steps.v.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: synapsemail:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the image
        run: |
          set -euo pipefail
          docker run -d --name sm -p 8080:80 synapsemail:ci
          for i in $(seq 40); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/install.php)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/db/install-probe.txt)" = 404
          docker exec sm php -r 'foreach (["intl","zip","gd","sodium","pdo_sqlite"] as $e) if (!extension_loaded($e)) { echo "missing $e\n"; exit(1); }'
          # the installer refuses later steps before the ownership step
          curl -s -c jar -b jar -o page.html http://127.0.0.1:8080/install.php
          csrf=$(sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p' page.html | head -1)
          curl -s -c jar -b jar -o page.html http://127.0.0.1:8080/install.php --data-urlencode "csrf=$csrf" --data-urlencode do=install
          grep -q 'Complete the steps in order' page.html
          if docker exec sm setup-key not-a-code; then echo "setup-key took a bad code"; exit 1; fi
          docker exec sm setup-key SM-0000-0000-0000
          docker logs sm
          docker rm -f sm

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: docker
          build-args: SYNAPSEMAIL_VERSION=${{ steps.v.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
